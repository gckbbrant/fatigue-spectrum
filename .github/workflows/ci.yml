name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Check and test the library
        run: |
          moon version --all
          moon update
          moon check --target native
          moon test --target native
          moon test --target js
      - name: Test the native command line
        run: |
          python3 tests/test_cli.py
          python3 tests/test_input_config.py
          python3 tests/test_reanalysis.py
      - name: Compare rainflow cycles
        run: |
          python3 -m venv _build/reference-env
          _build/reference-env/bin/python -m pip install rainflow==3.2.0
          _build/reference-env/bin/python scripts/compare_rainflow.py --cases 500 --seed 20261013
